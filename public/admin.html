<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#10141D">
<meta name="robots" content="noindex, nofollow">
<title>Admin — MindMapShare</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='42' fill='%234FD1E0'/><circle cx='38' cy='36' r='12' fill='%23ffffff' opacity='0.55'/></svg>">
<style>
  :root {
    --bg: #10141D;
    --panel: #141926;
    --line: #232938;
    --ink: #EDEFF4;
    --dim: #8A93A6;
    --accent: #4FD1E0;
    --danger: #F07A8F;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }
  body {
    background: var(--bg);
    font-family: 'Space Grotesk', system-ui, sans-serif;
    color: var(--ink);
    line-height: 1.5;
  }
  a { color: var(--accent); }

  .wrap { max-width: 1040px; margin: 0 auto; padding: 24px 20px 64px; }

  header.bar {
    display: flex; align-items: center; justify-content: space-between;
    gap: 16px; flex-wrap: wrap; margin-bottom: 24px;
  }
  .logo { font-size: 22px; font-weight: 700; letter-spacing: -0.5px; }
  .logo span { color: var(--accent); }
  .logo .tag {
    font-size: 12px; font-weight: 600; color: var(--dim);
    border: 1px solid var(--line); border-radius: 999px; padding: 2px 10px; margin-left: 10px;
    text-transform: uppercase; letter-spacing: 1px; vertical-align: middle;
  }

  button {
    font-family: inherit; cursor: pointer; border: none; border-radius: 10px;
    font-size: 14px; padding: 10px 16px; background: var(--line); color: var(--ink);
  }
  button:hover { filter: brightness(1.15); }
  button.primary { background: var(--accent); color: var(--bg); font-weight: 700; }
  button.ghost { background: transparent; border: 1px solid var(--line); color: var(--dim); }
  button.danger { background: transparent; border: 1px solid var(--danger); color: var(--danger); }
  button.danger:hover { background: var(--danger); color: var(--bg); filter: none; }
  button:disabled { opacity: 0.5; cursor: default; }

  /* --- login --- */
  .login { max-width: 380px; margin: 8vh auto 0; }
  .card {
    background: var(--panel); border: 1px solid var(--line);
    border-radius: 16px; padding: 28px;
  }
  .login h1 { font-size: 20px; margin: 0 0 6px; }
  .login p.sub { color: var(--dim); font-size: 14px; margin: 0 0 20px; }
  label.fld { display: block; font-size: 13px; color: var(--dim); margin-bottom: 6px; }
  input[type=password], input[type=text] {
    width: 100%; font-family: inherit; font-size: 15px; color: var(--ink);
    background: var(--bg); border: 1px solid var(--line); border-radius: 10px;
    padding: 12px 14px; margin-bottom: 16px;
  }
  input:focus { outline: none; border-color: var(--accent); }
  .login button { width: 100%; }
  .msg { min-height: 20px; font-size: 13px; margin: 4px 0 12px; }
  .msg.err { color: var(--danger); }
  .msg.ok { color: var(--accent); }

  /* --- stats --- */
  .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 14px; margin-bottom: 20px; }
  .tile { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 16px 18px; }
  .tile .n { font-size: 28px; font-weight: 700; letter-spacing: -0.5px; }
  .tile .k { font-size: 12px; color: var(--dim); text-transform: uppercase; letter-spacing: 1px; margin-top: 4px; }
  .tile .n.accent { color: var(--accent); }

  .meta-row { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 20px; }
  .chip {
    font-size: 12px; color: var(--dim); background: var(--panel);
    border: 1px solid var(--line); border-radius: 999px; padding: 5px 12px;
  }
  .chip b { color: var(--ink); font-weight: 600; }

  .toolbar { display: flex; gap: 10px; align-items: center; margin-bottom: 14px; flex-wrap: wrap; }
  .toolbar input[type=text] { margin: 0; flex: 1; min-width: 200px; }
  .toolbar .count { color: var(--dim); font-size: 13px; }

  /* --- table --- */
  .tablewrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 14px; }
  table { width: 100%; border-collapse: collapse; font-size: 14px; min-width: 720px; }
  thead th {
    text-align: left; font-size: 11px; text-transform: uppercase; letter-spacing: 1px;
    color: var(--dim); font-weight: 600; padding: 12px 14px; background: var(--panel);
    border-bottom: 1px solid var(--line); white-space: nowrap;
  }
  tbody td { padding: 12px 14px; border-bottom: 1px solid var(--line); vertical-align: middle; }
  tbody tr:last-child td { border-bottom: none; }
  tbody tr:hover { background: rgba(79, 209, 224, 0.04); }
  td.user b { font-weight: 700; }
  td.user .dn { color: var(--dim); font-size: 12px; }
  td.num { text-align: right; font-variant-numeric: tabular-nums; }
  .vis { font-size: 11px; text-transform: uppercase; letter-spacing: 1px; padding: 3px 9px; border-radius: 999px; border: 1px solid var(--line); color: var(--dim); }
  .vis.public { color: var(--accent); border-color: var(--accent); }
  .vis.private { color: var(--danger); border-color: var(--danger); }
  td.actions { text-align: right; white-space: nowrap; }
  td.actions button { padding: 6px 12px; font-size: 13px; }
  .empty { text-align: center; color: var(--dim); padding: 40px 16px; }

  .hidden { display: none !important; }
</style>
</head>
<body>
<div class="wrap">
  <div class="logo">Mind<span>Map</span>Share<span class="tag">Admin</span></div>

  <!-- Login gate -->
  <section id="loginView" class="login hidden">
    <div class="card">
      <h1>Admin sign-in</h1>
      <p class="sub">Enter the admin password to view site stats and manage users.</p>
      <form id="loginForm" autocomplete="off">
        <label class="fld" for="pw">Password</label>
        <input id="pw" type="password" autocomplete="current-password" required>
        <div id="loginMsg" class="msg"></div>
        <button type="submit" class="primary" id="loginBtn">Sign in</button>
      </form>
    </div>
    <p style="text-align:center;margin-top:16px"><a href="/">&larr; Back to MindMapShare</a></p>
  </section>

  <!-- Dashboard -->
  <section id="dashView" class="hidden">
    <header class="bar">
      <div class="chip" id="storageChip"></div>
      <div style="display:flex;gap:10px">
        <button class="ghost" id="refreshBtn">Refresh</button>
        <button class="ghost" id="logoutBtn">Sign out</button>
      </div>
    </header>

    <div class="stats" id="statTiles"></div>
    <div class="meta-row" id="metaRow"></div>

    <div class="toolbar">
      <input id="search" type="text" placeholder="Filter by username or display name…">
      <span class="count" id="rowCount"></span>
    </div>

    <div class="tablewrap">
      <table>
        <thead>
          <tr>
            <th>User</th>
            <th>Visibility</th>
            <th class="num">Maps</th>
            <th class="num">Nodes</th>
            <th class="num">Friends</th>
            <th class="num">Followers</th>
            <th>Joined</th>
            <th></th>
          </tr>
        </thead>
        <tbody id="userRows"></tbody>
      </table>
    </div>
    <div id="emptyState" class="empty hidden">No users match that filter.</div>
  </section>
</div>

<script src="admin.js"></script>
</body>
</html>
